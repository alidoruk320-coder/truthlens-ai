services:
  - type: web
    name: truthlens-backend
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: TOXICITY_MODELS_ENABLED
        value: "false"