services:
  - type: web
    name: truthlens-api
    runtime: python
    plan: pro
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: truthlens-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /var/data/truthlens.db
      - key: HF_HOME
        value: /var/data/huggingface
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false